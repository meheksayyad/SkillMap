{% extends "base.html" %}
{% block title %}Add resume · SkillMap{% endblock %}
{% block content %}
<h1>Add a resume</h1>
<div class="card">
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    {{ form.as_p }}
    <button>Save resume</button>
    <a class="btn secondary" href="{% url 'dashboard' %}">Cancel</a>
  </form>
</div>
{% endblock %}
