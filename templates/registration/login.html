{% extends "base.html" %}
{% block title %}Log in · SkillMap{% endblock %}
{% block content %}
<h1>Log in</h1>
<div class="card" style="max-width:460px">
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button>Log in</button>
    <p class="muted">No account? <a href="{% url 'signup' %}">Sign up</a></p>
  </form>
</div>
{% endblock %}
